{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'style3.css' %}">

<div class="result-page-container">
    <div class="result-card">
        <h1 class="form-title">Recommandation Finale</h1>
        <span class="subtitle">Analyse agro-climatique complétée</span>

        <!-- Icône de culture dynamique -->
        <div class="image-container" style="background: #ecfdf5; display: flex; align-items: center; justify-content: center;">
            <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L7 7H2V22H22V7H17L12 2Z"></path>
                <path d="M12 22V12"></path>
                <path d="M8 18l4-4 4 4"></path>
                <path d="M8 14l4-4 4 4"></path>
            </svg>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <span class="label">Culture Recommandée</span>
                <span class="value" style="color: var(--primary); font-size: 2.2rem; margin-top: 10px; display: block;">
                    {{ predicted_crop }}
                </span>
            </div>
        </div>

        <div class="actions">
            <a href="{% url 'selection' %}" class="btn-primary">
                Retour au menu principal
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001-1m-6 0h6"></path>
                </svg>
            </a>
            <a href="{% url 'analyze_characteristics' %}" class="btn-secondary">
                ← Nouvelle simulation
            </a>
        </div>
    </div>
</div>
{% endblock %}
