{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe - AGROsmart</title>
    <link rel="stylesheet" href="{% static 'connexion.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .form-section { width: 100%; display: flex; justify-content: center; align-items: center; background: #f8fafc; }
        .form-box { max-width: 450px; width: 100%; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="form-section" style="width: 100%;">
            <div class="form-box">
                <div class="mobile-logo" style="display: block; text-align: center; margin-bottom: 20px;">
                    <img src="{% static 'boval.jpg' %}" alt="Logo" style="width: 60px;">
                </div>
                <h2>Mot de passe oublié ?</h2>
                <p class="subtitle">Entrez votre adresse e-mail. Nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="input-group">
                        <label for="id_email">Adresse E-mail</label>
                        <input type="email" name="email" id="id_email" required placeholder="votre@email.com" 
                               style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; margin-top: 8px;">
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 20px;">
                        Envoyer le lien
                    </button>
                </form>
                <p class="switch-text" style="text-align: center; margin-top: 20px;">
                    <a href="{% url 'connexion' %}" style="color: #22c55e; text-decoration: none; font-weight: 500;">Retour à la connexion</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
