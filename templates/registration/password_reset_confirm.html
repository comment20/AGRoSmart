{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe - AGROsmart</title>
    <link rel="stylesheet" href="{% static 'connexion.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .form-section { width: 100%; display: flex; justify-content: center; align-items: center; background: #f8fafc; }
        .form-box { max-width: 450px; width: 100%; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .errorlist { color: #ef4444; list-style: none; padding: 0; font-size: 13px; margin-top: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="form-section" style="width: 100%;">
            <div class="form-box">
                <h2>Définir un nouveau mot de passe</h2>
                <p class="subtitle">Veuillez entrer votre nouveau mot de passe ci-dessous.</p>
                
                {% if validlink %}
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 20px;">
                        Changer le mot de passe
                    </button>
                </form>
                {% else %}
                <div style="text-align: center;">
                    <p style="color: #ef4444; font-weight: 600;">Le lien de réinitialisation est invalide ou a expiré.</p>
                    <a href="{% url 'password_reset' %}" style="color: #22c55e; text-decoration: none;">Demander un nouveau lien</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
