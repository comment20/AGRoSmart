{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail envoyé - AGRIcultSmart</title>
    <link rel="stylesheet" href="{% static 'connexion.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .form-section { width: 100%; display: flex; justify-content: center; align-items: center; background: #f8fafc; }
        .form-box { max-width: 450px; width: 100%; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="form-section" style="width: 100%;">
            <div class="form-box">
                <div style="font-size: 50px; margin-bottom: 20px;">✉️</div>
                <h2>Vérifiez votre boîte mail</h2>
                <p class="subtitle">Nous avons envoyé un lien de réinitialisation à votre adresse e-mail. Si vous ne le voyez pas, vérifiez vos spams.</p>
                <a href="{% url 'connexion' %}" class="btn-primary" style="display: block; text-decoration: none; padding: 14px; background: #22c55e; color: white; border-radius: 10px; font-weight: 600; margin-top: 30px;">
                    Retour à la connexion
                </a>
            </div>
        </div>
    </div>
</body>
</html>
